[package]
name = "snapfit"
description = "Compile-time verified, zero-cost dependency injection framework for Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
snapfit-macros = { workspace = true }

[features]
# Opt in to APIs whose shape may still change before they are stabilised:
# async containers (`mode = "async"`, `#[singleton(async)]`, `init().await`),
# transient dependencies (`#[transient]`) and custom builders (`builder = "..."`).
unstable = ["snapfit-macros/unstable"]

[package.metadata.docs.rs]
features = ["unstable"]
