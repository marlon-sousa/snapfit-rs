[package]
name = "snapfit"
description = "Compile-time verified, zero-cost dependency injection framework for Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Not `readme.workspace`: that names the root README, outside the package,
# beside this crate's own `README.md`, and cargo warns about the two.
readme = "README.md"
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
snapfit-macros = { workspace = true }

[features]
# Opt in to APIs whose shape may still change before they are stabilised:
# async containers (`mode = "async"`, `#[singleton(async)]`, `init().await`)
# and transient dependencies (`#[transient]`).
# docs.rs documents the default build only, the stable API the book teaches.
unstable = ["snapfit-macros/unstable"]
