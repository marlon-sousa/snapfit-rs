[workspace]
resolver = "3"
members = [
    "snapfit",
    "snapfit-macros",
    "xtask",
    "tests",
    "book",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"
authors = ["snapfit contributors"]
repository = "https://github.com/marlon-sousa/snapfit-rs"
readme = "README.md"

[workspace.dependencies]
snapfit = { path = "snapfit", version = "0.1.0" }
snapfit-macros = { path = "snapfit-macros", version = "0.1.0" }
thiserror = "2.0"
strum = { version = "0.27", features = ["derive"] }
derive-new = "0.7"
derive_more = { version = "2.1", features = ["deref", "display", "from", "into", "as_ref"] }
petgraph = { version = "0.7", default-features = false }
cucumber = "0.21"
futures = "0.3"
rayon = "1.10"
