[workspace]
resolver = "3"
members = [
    "snapfit",
    "snapfit-macros",
    "xtask",
    "tests",
    "book",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"
authors = ["snapfit contributors"]
repository = "https://github.com/marlon-sousa/snapfit-rs"
readme = "README.md"
homepage = "https://marlon-sousa.github.io/snapfit-rs/"
keywords = ["dependency-injection", "di", "ioc", "container", "compile-time"]
categories = ["rust-patterns"]

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
snapfit = { path = "snapfit", version = "0.2.0" }
snapfit-macros = { path = "snapfit-macros", version = "=0.2.0" }
thiserror = "2.0"
strum = { version = "0.27", features = ["derive"] }
derive-new = "0.7"
derive_more = { version = "2.1", features = ["display", "from"] }
cucumber = "0.21"
futures = "0.3"
compile-outcomes = "0.1.3"
bon = "=3.9.3"
mockall = "=0.15.0"
typed-builder = "=0.22.0"
proptest = { version = "1.11", default-features = false, features = ["std"] }
