[workspace]
resolver = "2"
members = [
    "wireup",
    "wireup_macros",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"
authors = ["wireup contributors"]
repository = "https://github.com/marlon-sousa/wireup-rs"
readme = "README.md"

[workspace.dependencies]
thiserror = "2.0"
strum = { version = "0.27", features = ["derive"] }
derive-new = "0.7"
derive_more = { version = "2.1", features = ["deref", "display", "from", "into", "as_ref"] }
petgraph = { version = "0.7", default-features = false }
