[package]
name = "snapfit_bdd"
description = "BDD integration test suite and reference application fixtures for snapfit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
cucumber = { workspace = true }
futures = { workspace = true }
rayon = { workspace = true }
snapfit = { workspace = true }

[features]
# Runs the `features/unstable` suite against snapfit's unstable APIs instead of
# the stable suite. Use a separate target dir (see `cargo xtask test`).
unstable = ["snapfit/unstable"]

[[test]]
name = "bdd"
path = "src/bdd.rs"
harness = false
