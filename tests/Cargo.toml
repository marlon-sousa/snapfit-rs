[package]
name = "snapfit_bdd"
description = "BDD integration test suite and reference application fixtures for snapfit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
bon = { workspace = true }
cucumber = { workspace = true }
futures = { workspace = true }
snapfit = { workspace = true }
strum = { workspace = true }
typed-builder = { workspace = true }

[dev-dependencies]
compile-outcomes = { workspace = true }

[features]
# Runs the `features/unstable` suite against snapfit's unstable APIs instead of
# the stable suite, and compiles the fixtures with that feature too.
unstable = ["snapfit/unstable"]

[[test]]
name = "bdd"
path = "src/bdd.rs"
harness = false
