# snapfit as the fixtures of tests/fixtures/renamed reach it: a crate named
# di, since compile-outcomes cannot write a renamed dependency, which depends
# on snapfit itself under the name inject, as a user's Cargo.toml would.
[package]
name = "di"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "lib.rs"

[dependencies]
inject = { package = "snapfit", path = "../../../snapfit" }
