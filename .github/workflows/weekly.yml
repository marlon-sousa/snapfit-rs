name: Weekly

# The tests on Rust beta, as docs/WORKFLOW.md, section 7, says.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  beta:
    name: cargo xtask test, Rust beta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install beta --profile minimal
      - run: cargo +beta xtask test
