name: Release

# docs/WORKFLOW.md, "Releases". Pushing a tag v<version> releases that
# version. The release gate refuses a tag that may not become a release, the
# checks of ci.yml run again on the tagged commit, the crates are packed, and
# the GitHub release waits for all of them. On a pull request that changes how
# releases are made, the release tools run against their fixtures, and nothing
# is released.
#
# Until crates.io's trusted publishing is set up for snapfit and
# snapfit-macros, which needs both crates to exist there, the crates.io job
# only runs `cargo publish --dry-run`: the first version is published by hand,
# and a later pull request makes the job publish.

on:
  push:
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/release.yml
      - .github/release/**
      - cliff.toml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A release, once started, is never cut short by another run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

jobs:
  gate:
    name: release gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      crates-io: ${{ steps.crates-io.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - run: .github/release/gate.sh "$TAG" "$GITHUB_SHA"
      - name: Tell whether the version goes to crates.io
        id: crates-io
        run: |
          publish=$(.github/release/crates-io.sh "$TAG")
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  ci:
    name: checks
    needs: gate
    uses: ./.github/workflows/ci.yml

  release-tools:
    name: release tools, against their fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: .github/release/test-gate.sh
      - run: .github/release/test-crates-io.sh

  package:
    # The .crate files crates.io would receive, attached to the GitHub release.
    name: the crates' packages
    needs: release-tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: cargo package --package snapfit-macros --package snapfit --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: target/package/*.crate
          if-no-files-found: error

  publish:
    # Only a version without a pre-release part, or a release candidate, goes
    # to crates.io. For now a dry run, as the comment at the top says.
    name: crates.io (dry run)
    if: github.event_name == 'push' && needs.gate.outputs.crates-io == 'true'
    needs: [gate, ci, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo publish --workspace --dry-run --locked

  release:
    name: GitHub release
    # Runs once crates.io's job passed, or was skipped because the gate said
    # the version does not go there, and every check and package passed: a job
    # whose needs failed is skipped too, so the crates.io job's being skipped
    # alone does not say the rest passed.
    if: >-
      github.event_name == 'push' && !cancelled()
      && needs.ci.result == 'success' && needs.package.result == 'success'
      && (needs.publish.result == 'success'
        || (needs.publish.result == 'skipped' && needs.gate.outputs.crates-io == 'false'))
    needs: [gate, ci, package, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist/
      - uses: itinera-dev/actions/create-release@d49d88f6b15f4d4c344503e9e3304a449ee3ebe8 # v1.11.0
        with:
          assets: dist/
