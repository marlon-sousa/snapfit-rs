name: Release

# Releases a version on a tag v<version>, as docs/WORKFLOW.md, section 9, says.

# Only a tag: a pull request runs release-checks.yml, which this workflow calls.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

jobs:
  gate:
    name: release gate
    runs-on: ubuntu-latest
    outputs:
      crates-io: ${{ steps.crates-io.outputs.publish }}
      site: ${{ steps.site.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - run: .github/release/gate.sh "$TAG" "$GITHUB_SHA"
      - name: Tell whether the version goes to crates.io
        id: crates-io
        run: |
          publish=$(.github/release/crates-io.sh "$TAG")
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Tell whether the version publishes the site
        id: site
        run: |
          publish=$(.github/release/site.sh "$TAG")
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  ci:
    name: checks
    needs: gate
    uses: ./.github/workflows/ci.yml

  release-checks:
    name: release checks
    uses: ./.github/workflows/release-checks.yml

  publish:
    # Trusted publishing, as docs/WORKFLOW.md, section 9, says: crates.io trusts
    # this workflow in the crates-io environment, which only v* tags may use,
    # and gives it a short-lived token.
    name: crates.io
    if: needs.gate.outputs.crates-io == 'true'
    needs: [gate, ci, release-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    name: GitHub release
    # A job whose needs failed is skipped too, so a skipped crates.io job alone
    # does not say the rest passed.
    if: >-
      !cancelled()
      && needs.ci.result == 'success' && needs.release-checks.result == 'success'
      && (needs.publish.result == 'success'
        || (needs.publish.result == 'skipped' && needs.gate.outputs.crates-io == 'false'))
    needs: [gate, ci, release-checks, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist/
      - uses: itinera-dev/actions/create-release@d49d88f6b15f4d4c344503e9e3304a449ee3ebe8 # v1.11.0
        with:
          assets: dist/

  site:
    name: the site
    # The book edition and front page of a release without a pre-release part,
    # once its GitHub release exists, as docs/WORKFLOW.md, section 9, says.
    if: >-
      !cancelled()
      && needs.release.result == 'success' && needs.gate.outputs.site == 'true'
    needs: [gate, release]
    permissions:
      contents: write
    uses: ./.github/workflows/site.yml
    with:
      version: ${{ github.ref_name }}
